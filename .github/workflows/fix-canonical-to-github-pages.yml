name: Fix canonical URLs to current GitHub Pages domain

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/fix-canonical-to-github-pages.yml"

permissions:
  contents: write

jobs:
  fix-domain:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace pending custom domain with current live domain
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('.')
          old = 'https://prohouse.sa'
          new = 'https://prohouse-sa.github.io'
          text_exts = {'.html', '.xml', '.txt', '.js', '.css', '.md', '.json'}

          for p in root.rglob('*'):
              if not p.is_file():
                  continue
              if '.git' in p.parts or '.github' in p.parts:
                  continue
              if p.suffix.lower() not in text_exts and p.name not in {'robots.txt'}:
                  continue
              try:
                  text = p.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              if old in text:
                  p.write_text(text.replace(old, new), encoding='utf-8')

          # Current public URL is GitHub Pages until the custom domain is approved.
          cname = root / 'CNAME'
          if cname.exists():
              cname.unlink()

          robots = root / 'robots.txt'
          if robots.exists():
              text = robots.read_text(encoding='utf-8')
              lines = [ln for ln in text.splitlines() if not ln.startswith('Sitemap:')]
              while lines and not lines[-1].strip():
                  lines.pop()
              lines += ['', 'Sitemap: https://prohouse-sa.github.io/sitemap.xml']
              robots.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Remove one-time workflow
        run: rm -f .github/workflows/fix-canonical-to-github-pages.yml

      - name: Commit and publish
        run: |
          git config user.name "Pro House SEO Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Use GitHub Pages as canonical domain until custom domain approval"
          git push origin HEAD:main
          git push --force origin HEAD:gh-pages
