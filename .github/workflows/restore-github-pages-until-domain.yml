name: Restore GitHub Pages URL until custom domain approval

on:
  push:
    branches: ["main"]
    paths:
      - "tools/restore_github_pages_until_domain.py.gz.b64"
      - ".github/workflows/restore-github-pages-until-domain.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode and apply temporary domain rollback
        run: |
          base64 --decode tools/restore_github_pages_until_domain.py.gz.b64 | gzip --decompress > /tmp/restore_github_pages_until_domain.py
          python /tmp/restore_github_pages_until_domain.py

      - name: Remove one-time updater
        run: |
          rm -f tools/restore_github_pages_until_domain.py.gz.b64
          rm -f .github/workflows/restore-github-pages-until-domain.yml
          rmdir tools 2>/dev/null || true

      - name: Commit restored GitHub Pages URLs
        run: |
          git config user.name "Pro House SEO Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Use GitHub Pages URL until custom domain is approved"
          git push origin HEAD:main
